[project]
name = "multiagent-tg"
version = "0.1.0"
description = "Мультиагентная система с Telegram-аккаунтами для совместной разработки сайтов"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "telethon>=1.36.0",
    "openai>=1.40.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "aiosqlite>=0.20.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "tenacity>=8.2.3",
]

[project.scripts]
multiagent-tg = "multiagent_tg.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/multiagent_tg"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]
